<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" fill="#3B82F6" rx="200"/>

  <!-- Presentation slides icon -->
  <g transform="translate(256, 280)">
    <!-- First slide (leftmost) -->
    <rect x="0" y="0" width="140" height="110" fill="#FFFFFF" rx="8"/>
    <line x1="10" y1="20" x2="130" y2="20" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="10" y1="45" x2="130" y2="45" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="60" x2="100" y2="60" stroke="#E5E7EB" stroke-width="4" stroke-linecap="round"/>

    <!-- Second slide (middle) -->
    <rect x="170" y="20" width="140" height="110" fill="#60A5FA" rx="8"/>
    <line x1="180" y1="40" x2="300" y2="40" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <line x1="180" y1="65" x2="300" y2="65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="180" y1="80" x2="270" y2="80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- Third slide (rightmost) -->
    <rect x="340" y="40" width="140" height="110" fill="#1E40AF" rx="8"/>
    <line x1="350" y1="60" x2="470" y2="60" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
    <line x1="350" y1="85" x2="470" y2="85" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Play/present icon indicator -->
  <circle cx="512" cy="820" r="60" fill="#10B981" opacity="0.9"/>
  <polygon points="512,780 545,820 512,860" fill="#FFFFFF"/>
</svg>
